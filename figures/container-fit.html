const W = { P: null };

const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const unit = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const scale3 = (a, s) => [a[0] * s, a[1] * s, a[2] * s];

function viewOf() {
  const { sinA, cosA, sinE, cosE } = cameraOf(W.P);
  return { view: [cosA * cosE, sinA * cosE, sinE], light: [-sinA, cosA, 0] };
}

function hull2(points) {
  const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const turn = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [], upper = [];
  for (const p of sorted) { while (lower.length >= 2 && turn(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop(); lower.push(p); }
  for (let i = sorted.length - 1; i >= 0; i--) { const p = sorted[i]; while (upper.length >= 2 && turn(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop(); upper.push(p); }
  return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}

function hullOf(points) {
  return pathOf(hull2(points.map((p) => iso(p, W.P))), true);
}

// A convex prism on any axis: `cap` is one end (3D points, convex, in order), `axis` the extrusion vector.
// Shaded with the kit's four side tones; a cap facing up uses the top tone.
function prism(cap, axis, { smooth = false } = {}) {
  const count = cap.length;
  const far = cap.map((p) => add(p, axis));
  const centre = scale3(cap.reduce((s, p) => add(s, p), add([0, 0, 0], scale3(axis, count / 2))), 1 / count);
  const { view, light } = viewOf();
  const faces = [];
  for (let i = 0; i < count; i++) {
    const j = (i + 1) % count;
    let n = unit(cross(sub(cap[j], cap[i]), axis));
    const mid = scale3(add(add(cap[i], cap[j]), add(far[i], far[j])), 0.25);
    if (dot(n, sub(mid, centre)) < 0) n = scale3(n, -1);
    faces.push({ n, pts: [cap[i], cap[j], far[j], far[i]], side: i });
  }
  const ax = unit(axis);
  faces.push({ n: scale3(ax, -1), pts: cap, cap: true });
  faces.push({ n: ax, pts: far, cap: true });
  const shades = [[], [], [], []];
  let top = "";
  const visible = faces.map((f) => dot(f.n, view) > 1e-6);
  faces.forEach((f, idx) => {
    if (!visible[idx]) return;
    const d = pathOf(f.pts.map((p) => iso(p, W.P)), true);
    if (f.cap && f.n[2] > 0.7) { top += d; return; }
    const lit = (dot(f.n, light) + 1) / 2;
    shades[Math.min(3, Math.max(0, Math.floor(lit * 4)))].push(d);
  });
  const crease = [];
  for (let i = 0; i < count; i++) {
    const j = (i + 1) % count;
    for (const capIdx of [count, count + 1]) {
      if (visible[i] && visible[capIdx]) {
        const ring = capIdx === count ? cap : far;
        crease.push(pathOf([iso(ring[i], W.P), iso(ring[j], W.P)]));
      }
    }
    if (!smooth && visible[i] && visible[(i + 1) % count]) crease.push(pathOf([iso(far[j], W.P), iso(cap[j], W.P)]));
  }
  const fill = hullOf([...cap, ...far]);
  return { fill, outline: fill, crease: crease.join(""), top, shades: shades.map((s) => s.join("")) };
}

// A six-sided cell from 8 corners (a deformed box): [x0y0z0, x1y0z0, x1y1z0, x0y1z0, then the same at z1].
function hexa(c) {
  const faces = [[0, 1, 2, 3], [4, 7, 6, 5], [0, 4, 5, 1], [1, 5, 6, 2], [2, 6, 7, 3], [3, 7, 4, 0]];
  const mid = scale3(c.reduce((s, p) => add(s, p), [0, 0, 0]), 1 / 8);
  const { view, light } = viewOf();
  const shades = [[], [], [], []];
  let top = "";
  for (const f of faces) {
    const [a, b, cc, d] = f.map((i) => c[i]);
    let n = unit(cross(sub(cc, a), sub(d, b)));
    const fm = scale3(add(add(a, b), add(cc, d)), 0.25);
    if (dot(n, sub(fm, mid)) < 0) n = scale3(n, -1);
    if (dot(n, view) <= 1e-6) continue;
    const path = pathOf([a, b, cc, d].map((p) => iso(p, W.P)), true);
    if (n[2] > 0.7) { top += path; continue; }
    shades[Math.min(3, Math.max(0, Math.floor(((dot(n, light) + 1) / 2) * 4)))].push(path);
  }
  const fill = hullOf(c);
  return { fill, outline: fill, crease: "", top, shades: shades.map((s) => s.join("")) };
}

// A spur gear outline in the floor plane: centre, root and tip radius, tooth count, turn.
function gearRing(cx, cy, root, tip, teeth, turn = 0) {
  const out = [];
  const profile = [[0, root], [0.18, root], [0.3, tip], [0.55, tip], [0.67, root]];
  for (let i = 0; i < teeth; i++) {
    const a0 = turn + (i / teeth) * Math.PI * 2, w = (Math.PI * 2) / teeth;
    for (const [f, r] of profile) out.push([cx + r * Math.cos(a0 + f * w), cy + r * Math.sin(a0 + f * w)]);
  }
  return out;
}

// Points of a circle (or n-gon) centred at c in the plane spanned by unit vectors u, v.
function circle3(c, u, v, r, steps = 32, phase = 0) {
  return Array.from({ length: steps }, (_, i) => {
    const a = phase + (i / steps) * Math.PI * 2;
    return add(c, add(scale3(u, r * Math.cos(a)), scale3(v, r * Math.sin(a))));
  });
}

// A round bar or disc on any axis: centre of the near cap c, axis vector (length = thickness).
function roundOn(c, axis, r, steps = 28) {
  const ax = unit(axis);
  const helper = Math.abs(ax[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0];
  const u = unit(cross(ax, helper));
  const v = unit(cross(ax, u));
  return prism(circle3(c, u, v, r, steps), axis, { smooth: true });
}

// The visible half of a ring around a bar that runs along x (a seam or fin on its surface).
function sideRingAt(c, r, steps = 32) {
  const { view } = viewOf();
  const mid = Math.atan2(view[2], view[1]);
  return pathOf(Array.from({ length: steps + 1 }, (_, i) => {
    const a = mid - Math.PI / 2 + (i / steps) * Math.PI;
    return iso([c[0], c[1] + r * Math.cos(a), c[2] + r * Math.sin(a)], W.P);
  }));
}

// A rotated box standing on the floor plane: centre (cx, cy), size w × d, turned by angle, z0..z0+h.
function boxAt(cx, cy, w, d, angle, z0, h) {
  const c = Math.cos(angle), s = Math.sin(angle);
  const pt = (x, y) => [cx + x * c - y * s, cy + x * s + y * c, z0];
  return prism([pt(-w / 2, -d / 2), pt(w / 2, -d / 2), pt(w / 2, d / 2), pt(-w / 2, d / 2)], [0, 0, h]);
}

const path3 = (points, closed = false) => pathOf(points.map((p) => iso(p, W.P)), closed);
const at3 = (p) => iso(p, W.P);

// A ruler strip lying on a surface along x, with minor and major ticks.
function ruler(x, y, w, z, { step = 5, every = 5 } = {}) {
  const P = W.P;
  const strip = { x, y, w, d: 7, r: 1 };
  const ticks = topTicks(x + 4, x + w - 4, step, every, y + 0.8, z + 0.6, [2, 3.6], P);
  return solidSvg(slabOf(strip, z, 0.6, P, 3), { tone: "lo", crease: "none" }) + lineSvg(ticks.minor, { tone: "lo" }) + lineSvg(ticks.major, { tone: "mid" }) + dotsSvg([iso([x + 2, y + 3.5, z + 0.6], P), iso([x + w - 2, y + 3.5, z + 0.6], P)], { size: 0.45 });
}

// A slotted-mass hanger: base disc, rod, `units` discs (fraction allowed), hook on top.
// Returns the svg and the z of the hook eye, where the cord ties on.
function weights(x, y, zb, units, { lit = false, r = 7, unit: h = 3.4, tone = "hi" } = {}) {
  const P = W.P;
  const out = [];
  out.push(solidSvg(cylinder(x, y, r * 0.82, zb, 1.6, P, 28, 0.3), { tone: "mid" }));
  let z = zb + 1.6;
  const whole = Math.floor(units + 1e-6);
  const part = units - whole;
  const discs = [];
  for (let i = 0; i < whole; i++) discs.push(h);
  if (part > 0.04) discs.push(h * part);
  for (const t of discs) {
    out.push(solidSvg(cylinder(x, y, r, z, t - 0.25, P, 32, Math.min(0.4, t / 4)), { tone, crease: "lo", lit }));
    z += t;

  out.push(solidSvg(cylinder(x, y, 1.1, z - 0.25, 5, P, 14), { tone: "mid", crease: "none" }));
  z += 4.75;
  out.push(solidSvg(cylinder(x, y, 1.9, z, 1.2, P, 16), { tone: "mid" }));

  out.push(lineSvg(path3(eye, true), { tone: "mid" }));

// A pulley wheel in the vertical plane that contains direction (dx, dy), on a fork.
function pulley(c, dx, dy, r = 5, t = 3) {
  const along = unit([dx, dy, 0]);
  const side = [-along[1], along[0], 0];
  const near = add(c, scale3(side, -t / 2));
  const wheel = prism(circle3(near, along, [0, 0, 1], r, 28), scale3(side, t), { smooth: true });

}

function knob(x, y, r, z, h) {

  return solidSvg(cylinder(x, y, r, z, h, P, 28), { tone: "mid" }) + lineSvg(knurl(x, y, r, z, z + h, 26, P), { tone: "lo" });

// A 20 ft container floor, 590 × 235 cm, walls cut down so the load plan shows. 1 unit = 1 cm.
const CF = { L: 590, D: 235, WALL: 60 };
const LAYOUTS = ["EUR mixed", "EUR plain grid", "Industrial 1.2 × 1.0"];

function layoutOf(i) {
  const out = [];
  if (i === 0) {
    for (let k = 0; k < 7; k++) out.push([k * 80, 0, 80, 120]);
    for (let k = 0; k < 4; k++) out.push([k * 120, 120, 120, 80]);
  } else if (i === 1) {
    for (let r = 0; r < 2; r++) for (let c = 0; c < 4; c++) out.push([c * 120, r * 80, 120, 80]);
  } else {
    for (let r = 0; r < 2; r++) for (let c = 0; c < 4; c++) out.push([c * 120, r * 100, 120, 100]);
  }
  const area = out.reduce((s, p) => s + p[2] * p[3], 0);
  return { pallets: out, count: out.length, util: area / (CF.L * CF.D) * 100 };
}

const box = (x0, x1, y0, y1, z0, z1) => prism([[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]], [0, 0, z1 - z0]);

function boxStatic() {
  const { L, D, WALL } = CF;
  const out = [`<path class="iso-halo" d="${path3([[-10, -10, -14], [L + 10, -10, -14], [L + 10, D + 10, -14], [-10, D + 10, -14]], true)}"/>`];
  for (const x of [-8, L - 8]) for (const y of [-8, D - 8]) out.push(solidSvg(box(x, x + 16, y, y + 16, -14, 0), { tone: "mid" }));
  out.push(solidSvg(box(-8, L + 8, -8, D + 8, -10, 0), { tone: "mid" }));
  const boards = [];
  for (let y = 20; y < D; y += 20) boards.push(path3([[0, y, 0], [L, y, 0]]));
  out.push(lineSvg(boards.join(""), { tone: "faint" }));
  out.push(solidSvg(box(-8, L + 8, -8, 0, 0, WALL), { tone: "mid" }));
  const ribs = [];
  for (let x = 10; x < L; x += 20) ribs.push(path3([[x, 0, 2], [x, 0, WALL - 2]]));
  out.push(lineSvg(ribs.join(""), { tone: "lo" }));
  out.push(solidSvg(box(-8, 0, 0, D + 8, 0, WALL), { tone: "mid" }));
  for (let y = 10; y < D; y += 20) out.push(lineSvg(path3([[0, y, 2], [0, y, WALL - 2]]), { tone: "lo" }));
  out.push(lineSvg(path3([[-8, -8, WALL], [L + 8, -8, WALL]]) + path3([[-8, -8, WALL], [-8, D + 8, WALL]]), { tone: "mid", dashed: true }));
  return out.join("");
}

function loadLive(v) {
  const i = Math.max(0, Math.min(2, Math.round(v)));
  const { pallets } = layoutOf(i);
  const out = [];
  for (const [x, y, w, d] of [...pallets].sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]))) {
    out.push(solidSvg(box(x + 2, x + w - 2, y + 2, y + d - 2, 0, 10), { tone: "mid" }));
    out.push(solidSvg(box(x + 2, x + w - 2, y + 2, y + d - 2, 10, 14), { tone: "hi", crease: "lo", lit: i === 0 && d === 120 }));
    const along = w >= d;
    const lines = [];
    for (let k = 1; k < 5; k++) lines.push(along ? path3([[x + 2 + (w - 4) * k / 5, y + 2, 14], [x + 2 + (w - 4) * k / 5, y + d - 2, 14]]) : path3([[x + 2, y + 2 + (d - 4) * k / 5, 14], [x + w - 2, y + 2 + (d - 4) * k / 5, 14]]));
    out.push(lineSvg(lines.join(""), { tone: "faint" }));
  }
  const door = CF.L + 8;
  out.push(solidSvg(prism([[door, -8, 0], [door + 4, -8, 0], [door + 4, -8 - 110, 0], [door, -8 - 110, 0]], [0, 0, CF.WALL + 140]), { tone: "mid" }));
  out.push(solidSvg(roundOn([door + 4, -40, 30], [0, 0, 150], 1.6, 10), { tone: "mid" }));
  return out.join("");
}
